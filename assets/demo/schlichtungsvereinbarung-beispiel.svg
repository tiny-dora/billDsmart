<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" font-family="Georgia, serif">
  <rect width="600" height="800" fill="#fff"/>
  <text x="50" y="80" font-size="22" font-weight="700" fill="#1C3258">Schlichtungsvereinbarung</text>
  <text x="50" y="104" font-size="13" fill="#56627A">Projekt P-2026-0142 · Einfamilienhaus Udligenswil LU</text>
  <g font-size="14" fill="#1C3258">
    <text x="50" y="160">Parteien: Sandra Meier (Bauherrschaft) und</text>
    <text x="50" y="182">Malerei Brunner GmbH, vertreten durch Marco Brunner (Unternehmer)</text>
    <text x="50" y="230">Gegenstand: Beanstandung des Meilensteins gemäss Werkvertrag.</text>
    <text x="50" y="278">Ergebnis der Schlichtung:</text>
    <text x="70" y="302">Die Parteien einigen sich auf die im billDsmart-Verfahren</text>
    <text x="70" y="324">gewählte Aufteilung des blockierten Betrags.</text>
    <text x="50" y="372">Mit der Beglaubigung durch die Notarin oder den Notar wird</text>
    <text x="50" y="394">die Vereinbarung über billDsmart automatisch umgesetzt.</text>
  </g>
  <line x1="50" y1="560" x2="260" y2="560" stroke="#1C3258"/><line x1="320" y1="560" x2="550" y2="560" stroke="#1C3258"/>
  <text x="50" y="580" font-size="12" fill="#56627A">Bauherrschaft</text><text x="320" y="580" font-size="12" fill="#56627A">Unternehmer</text>
  <text x="50" y="760" font-size="12" fill="#56627A">Beispiel-Dokument für die Demo · fiktive Daten</text>
